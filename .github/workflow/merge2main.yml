name: Code analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Python Code Complexity
        continue-on-error: true
        uses: rohaquinlop/complexipy-action@v2
        with:
          paths: matr1x
          details: low
          sort: desc
