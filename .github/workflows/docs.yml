name: CI Docs

on: workflow_dispatch

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install package and dependencies
        run: uv sync --locked --all-extras --group docs --no-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgbm1 libxkbcommon0 libnss3 libnspr4 libasound2t64

      - name: Build docs
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --group docs --no-dev great-docs build

      # The API reference pages are named after griffe canonical paths
      # (``module:Item``). The colon is rejected by upload-artifact (and by
      # NTFS on download), so rename ``:`` to ``.`` and rewrite the links.
      - name: Sanitize reference page names
        run: |
          python - <<'EOF'
          import pathlib

          site = pathlib.Path("great-docs/_site")
          old_names = sorted(
              (p.name for p in site.rglob("*") if p.is_file() and ":" in p.name),
              key=len,
              reverse=True,
          )
          for old in old_names:
              new = old.replace(":", ".")
              for f in site.rglob("*"):
                  if not f.is_file():
                      continue
                  try:
                      text = f.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if old in text:
                      f.write_text(text.replace(old, new), encoding="utf-8")
              for f in site.rglob(old):
                  if f.is_file():
                      f.rename(f.with_name(new))
          EOF

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/development'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
