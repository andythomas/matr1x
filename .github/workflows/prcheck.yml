---
name: PR-check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - development
      - release-candidate

permissions:
  pull-requests: write
  contents: write

jobs:
  PR-Title-and-ruff:
    if: >
      startsWith(github.head_ref, 'ruff-patches') == false &&
      startsWith(github.head_ref, 'complexipy-patches') == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    timeout-minutes: 1
    runs-on: ubuntu-latest
    # expose filter result so downstream jobs can use it
    outputs:
      related_code_changed: ${{ steps.filter.outputs.related_code_changed }}

    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            related_code_changed:
              - '**/*.py'
              - '.github/workflows/**'

      - name: Examine the pull request title
        id: titlecheck
        continue-on-error: true
        run: >
          grep -qP --
          '^(build|ci|docs|feat|fix|perf|refactor|style|test|chore)((.+))?:\s.+'
          <<< '${{ github.event.pull_request.title }}'

      - name: check the pull request (branch) out
        if: steps.filter.outputs.related_code_changed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        if: steps.filter.outputs.related_code_changed == 'true'
        uses: ./.github/actions/setup-uv

      - name: Install ruff from uv.lock
        if: steps.filter.outputs.related_code_changed == 'true'
        run: |
          uv export --locked --no-dev --no-header --no-annotate --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          ruff_requirement="$(grep -E '^ruff==' "$RUNNER_TEMP/requirements.txt")"
          uv tool install "$ruff_requirement" --constraints "$RUNNER_TEMP/requirements.txt"

      - name: Show ruff version
        if: steps.filter.outputs.related_code_changed == 'true'
        run: ruff --version

      - name: Auto-fix code with ruff
        if: steps.filter.outputs.related_code_changed == 'true'
        run: ruff check --fix-only

      - name: Format code with ruff
        if: steps.filter.outputs.related_code_changed == 'true'
        run: ruff format

      - name: Test for changes
        if: steps.filter.outputs.related_code_changed == 'true'
        id: ruff
        continue-on-error: true
        run: |
          if ! git diff --quiet; then
            echo "Ruff applied fixes, failing the step."
            exit 1
          fi

      - name: Test for unresolved issues
        if: steps.filter.outputs.related_code_changed == 'true'
        run: ruff check

      - name: Create pull request
        if: steps.filter.outputs.related_code_changed == 'true' && steps.ruff.outcome == 'failure'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: ruff action fixes
          title: Fixes by PR-check action
          body: This is an auto-generated PR with fixes by ruff.
          labels: ruff, automated pr
          branch: "ruff-patches/${{ github.head_ref }}"
          base: ${{ github.head_ref }}

      - name: Fail if ruff made changes and print explanantion
        if: steps.filter.outputs.related_code_changed == 'true' && steps.ruff.outcome == 'failure'
        run: |
          echo "## Code formatting Error" >> $GITHUB_STEP_SUMMARY
          echo "Some code needs polishing. A pull request with" >> $GITHUB_STEP_SUMMARY
          echo "suggestions will be made by a bot." >> $GITHUB_STEP_SUMMARY
          echo "ERROR1=Code needs polishing, bot created pull request." >> $GITHUB_ENV

      - name: Fail if title formatting is off and print explanation
        if: steps.filter.outputs.related_code_changed == 'true' && steps.titlecheck.outcome == 'failure'
        run: |
          echo "## PR title formatting error!" >> $GITHUB_STEP_SUMMARY
          echo "The pull request title needs 'semantic commit message' formatting" >> $GITHUB_STEP_SUMMARY
          echo "Please see e.g. https://gist.github.com/joshbuchea/6f47e86d2510bce28f8e7f42ae84c716" >> $GITHUB_STEP_SUMMARY
          echo "ERROR2=Use semantic commit message formatting." >> $GITHUB_ENV

      - name: Failure exit
        if: >
          (steps.filter.outputs.related_code_changed == 'true' && steps.ruff.outcome == 'failure') ||
          steps.titlecheck.outcome == 'failure'
        run: |
          echo ${{ env.ERROR1 }}
          echo ${{ env.ERROR2 }}
          echo "Please click the left Summary tab for more information."
          exit 1

  build:
    needs: PR-Title-and-ruff
    if: needs.PR-Title-and-ruff.outputs.related_code_changed == 'true' && github.event.action != 'edited'
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026, macos-latest]
        python-version: ["3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Cache & install apt packages (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: |
            libegl1
            libpulse0
            desktop-file-utils
          version: ${{ runner.image }}-v1 # bump to bust cache intentionally

      - name: Install dependencies
        run: >
          uv sync --locked --all-extras
        shell: bash

      - name: Run type checker
        run: >
          ty check

      - name: Test matr1x
        timeout-minutes: 4
        run: |
          pytest -v
        shell: bash
