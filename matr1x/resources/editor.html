<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body,
            #container {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
            }

            .highlighted-line {
                background-color: var(--highlight-bg) !important;
            }

            .highlighted-line-decoration {
                background-color: var(--highlight-border) !important;
                width: 4px !important;
            }
        </style>

        <!-- QWebChannel for Python communication -->
        <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

        <!-- Monaco loader -->
        <script src="monaco/vs/loader.js"></script>

        <script>
            let editor;
            let linter;
            let editorBackend;
            let currentDiagnostics = [];
            let lintingTimeout = null;
            let isModified = false;

            new QWebChannel(qt.webChannelTransport, function (channel) {
                linter = channel.objects.linter;
                editorBackend = channel.objects.editor_backend;

                // Listen for linting results
                linter.lintingComplete.connect(function (diagnosticsJson) {
                    const diagnostics = JSON.parse(diagnosticsJson);
                    updateEditorDiagnostics(diagnostics);
                });

                console.log(
                    "QWebChannel initialized, linter and editor backend connected",
                );
            });

            require.config({ paths: { vs: "monaco/vs" } });

            require(["vs/editor/editor.main"], function () {
                editor = monaco.editor.create(
                    document.getElementById("container"),
                    {
                        value: "",
                        language: "python",
                        theme: "vs-light",
                        automaticLayout: true,
                        minimap: {
                            enabled: false,
                        },
                        scrollBeyondLastLine: false,
                        fontSize: 14,
                        lineHeight: 21,
                        renderWhitespace: "boundary",
                        // Tab completion settings
                        acceptSuggestionOnEnter: "on",
                        acceptSuggestionOnCommitCharacter: true,
                        suggestOnTriggerCharacters: true,
                        quickSuggestions: {
                            other: true,
                            comments: true,
                            strings: true,
                        },
                        wordBasedSuggestions: "allDocuments",
                        tabCompletion: "on",
                    },
                );

                // Register custom completion provider
                const customCompletions = [
                    {
                        label: "system",
                        insertText: "system",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "Represents the object of the current system.",
                    },
                    {
                        label: "meta_data",
                        insertText: "meta_data",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "Dictionary containing metadata according to Dublin Core.",
                    },
                    {
                        label: "meta_data['creator']",
                        insertText: "meta_data['creator']",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "The person performing this measurement.",
                    },
                    {
                        label: "meta_data['identifier']",
                        insertText: "meta_data['identifier']",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "An identifier for the measurement, e.g. the sample name.",
                    },
                    {
                        label: "meta_data['relation']",
                        insertText: "meta_data['relation']",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "Additonal information about the measurement identifier, e.g. an ancestor.",
                    },
                    {
                        label: "meta_data['description']",
                        insertText: "meta_data['description']",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation:
                            "Verbose information about the measurement.",
                    },
                    {
                        label: "devs",
                        insertText: "devs",
                        kind: monaco.languages.CompletionItemKind.Property,
                        documentation: "Dictionary of the connected devices.",
                    },
                    {
                        label: "wait(duration, until, message, silent)",
                        insertText:
                            "wait(${1:0}, until=${2:None}, message='${3:}', silent=${4:10})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Wait for either a duration or until a timestamp. " +
                            "Also acts as a breakpoint to pause and abort the execution." +
                            "Print a message for wait period more than silent",
                    },
                    {
                        label: "end_script(finished)",
                        insertText: "end_script(finished=${1:None})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "End script and mark as finished (True) or aborted (False) or query user (None).",
                    },
                    {
                        label: "input(query, timeout, default_value)",
                        insertText:
                            "input('${1:query}', timeout=${2:float('inf')}, default_value='${3}')",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Prompts the user for input with an optional timeout and default reply.",
                    },

                    {
                        label: "input_bool(query, timeout, default_value)",
                        insertText:
                            "input_bool('${1:query}', timeout=${2:float('inf')}, default_value='${3:yes}')",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Prompts the user for a yes/no input with an optional timeout and default reply.",
                    },
                    {
                        label: "input_numerical(query, timeout, default_value, min_value, max_value, step, decimals)",
                        insertText:
                            "input_numerical('${1:query}', timeout=${2:float('inf')}, default_value=${3:0.0}, min_value=${4:-100e9}, max_value=${5:100e9}, step=${6:1.0}, decimals=${7:2})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Prompts the user for numerical input with validation (min, max, step, decimals)" +
                            "and optional an optional default value and timeout.",
                    },
                    {
                        label: "init_datafile(filename, comment, append, print_header, ntot)",
                        insertText:
                            "init_datafile('${1:test}', comment='${2}', append=${3:False}, print_header=${4:True}, ntot=${5:None})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Initializes a new data file with optional comment, append mode, and header printing. The total entry count." +
                            "is used to calculate the total measurement duration.",
                    },
                    {
                        label: "measure_system(print_setpoint, print_data, print_telemetry)",
                        insertText:
                            "measure_system(print_setpoint=${1:True}, print_data=${2:True}, print_telemetry=${3:True})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Performs a system measurement with options to print setpoint, data, and telemetry.",
                    },
                    {
                        label: "set_value(value_index, value)",
                        insertText: "set_value(${1:0}, ${2:0})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Sets a system value by index (int)." +
                            "Please use 'help/system' for more information.",
                    },
                    {
                        label: "set_value(name, value)",
                        insertText: "set_value('${1:column}', ${2:0})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Sets a system value by name (str)." +
                            "Please use 'help/system' for more information.",
                    },
                    {
                        label: "read_value(value_index)",
                        insertText: "read_value(${1:0})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Reads a system value by index (int)." +
                            "Please use 'help/system' for more information.",
                    },
                    {
                        label: "read_value(name: str)",
                        insertText: "read_value('${1:column}')",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Reads a system value by name (str)." +
                            "Please use 'help/system' for more information.",
                    },
                    {
                        label: "trigger_value(value_index)",
                        insertText: "trigger_value(${1:0})",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Triggers a system value by index (int)." +
                            "Please use 'help/system' for more information.",
                    },
                    {
                        label: "trigger_value(name)",
                        insertText: "trigger_value('${1:column}')",
                        kind: monaco.languages.CompletionItemKind.Function,
                        insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                        documentation:
                            "Triggers a system value by name (str)." +
                            "Please use 'help/system' for more information.",
                    },
                ];

                monaco.languages.registerCompletionItemProvider("python", {
                    provideCompletionItems: function (model, position) {
                        const word = model.getWordUntilPosition(position);
                        const range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber: position.lineNumber,
                            startColumn: word.startColumn,
                            endColumn: word.endColumn,
                        };

                        const suggestions = customCompletions.map((item) => ({
                            ...item,
                            range,
                        }));

                        return { suggestions };
                    },
                });

                // Set up automatic linting on content changes
                let changeTimeout;
                editor.onDidChangeModelContent(() => {
                    // Mark as modified whenever content changes
                    setModified(true);

                    // Clear previous timeout
                    if (changeTimeout) {
                        clearTimeout(changeTimeout);
                    }

                    // Avoid too frequent calls
                    changeTimeout = setTimeout(() => {
                        triggerLinting();
                    }, 1000); // Wait 1 second after last change
                });

                // Initial linting
                setTimeout(() => {
                    triggerLinting();
                }, 500);

                // Make editor globally available
                window.editor = editor;
                window.triggerLinting = triggerLinting;

                console.log("Monaco Editor initialized");
            });

            function triggerLinting() {
                if (!linter || !editor) {
                    console.log("Linter or editor not ready");
                    return;
                }

                const code = editor.getValue();
                console.log("Triggering linting for code length:", code.length);

                linter.lint_code(code);
            }

            function updateEditorDiagnostics(diagnostics) {
                if (!editor) return;

                monaco.editor.setModelMarkers(
                    editor.getModel(),
                    "ruff",
                    diagnostics,
                );
                currentDiagnostics = diagnostics;
                console.log(
                    `Updated editor diagnostics: ${diagnostics.length} issues`,
                );
            }

            // Global functions for external access
            window.getLintingResults = function () {
                return currentDiagnostics;
            };

            window.setEditorContent = function (content) {
                if (editor) {
                    editor.setValue(content);
                    setTimeout(triggerLinting, 100);
                }
            };

            window.getEditorContent = function () {
                return editor ? editor.getValue() : "";
            };

            // Function to set modification state
            function setModified(modified) {
                if (modified !== isModified) {
                    isModified = modified;
                    console.log(
                        "Content modification state changed:",
                        isModified,
                    );
                    if (editorBackend) {
                        editorBackend.content_changed(isModified);
                    }
                }
            }

            // Function to set modification state from Python
            window.setModificationState = function (modified) {
                setModified(modified);
            };

            // Function to check if content is modified (for external access)
            window.isModified = function () {
                return isModified;
            };

            // Line highlighting utility functions
            window.highlightLine = function (lineNumber) {
                if (!editor) return;

                // Remove existing line highlighting
                if (window.currentLineHighlight) {
                    window.currentLineHighlight = editor.deltaDecorations(
                        window.currentLineHighlight,
                        [],
                    );
                }

                // Get theme colors
                const theme = editor._themeService.getColorTheme();
                const backgroundColor =
                    theme.getColor("editor.lineHighlightBackground") ||
                    theme.getColor("editor.selectionHighlightBackground");
                const borderColor =
                    theme.getColor("editorLineNumber.activeForeground") ||
                    theme.getColor("focusBorder");

                // Update CSS variables with theme colors
                document.documentElement.style.setProperty(
                    "--highlight-bg",
                    backgroundColor,
                );
                document.documentElement.style.setProperty(
                    "--highlight-border",
                    borderColor,
                );

                // Add new line highlighting using theme colors
                window.currentLineHighlight = editor.deltaDecorations(
                    [],
                    [
                        {
                            range: new monaco.Range(
                                lineNumber,
                                1,
                                lineNumber,
                                1,
                            ),
                            options: {
                                isWholeLine: true,
                                className: "highlighted-line",
                                linesDecorationsClassName:
                                    "highlighted-line-decoration",
                            },
                        },
                    ],
                );

                // Scroll to the highlighted line
                editor.revealLineInCenter(lineNumber);
            };

            window.clearLineHighlight = function () {
                if (editor && window.currentLineHighlight) {
                    window.currentLineHighlight = editor.deltaDecorations(
                        window.currentLineHighlight,
                        [],
                    );
                }
            };
        </script>
    </head>
    <body>
        <div id="container"></div>
    </body>
</html>
