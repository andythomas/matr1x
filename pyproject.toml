[project]
name = "matr1x"
version = "7.3.0"
description = "Python package for data acquisition and measurement control"
requires-python = ">=3.6"
license = {text = "GPL-3.0-or-later"}
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "natsort",
  "numpy",
  "pandas",
  "psutil",
  "pyflakes",
  "pymeasure",
  "pyserial",
  "pyvisa",
  "pyvisa-py",
  'pyvisa-py < 0.6.0; python_version < "3.8"',
  "urwid>2.0",
  "wrapt",
  "pyqtgraph >= 0.11.0",
  "PyQt6",
  "PyQt6 >= 6.5.0 ; platform_system == 'Windows'",
  "PyQt6-QScintilla",
  "autopep8",
]
[project.optional-dependencies]
spi = ["spidev", "RPi"]
standa = ["PyUSMC", "pyximc"]
h5py = ["h5py"]
git = ["pygit2"]

[project.scripts]
matrix = "matr1x.scripts.matrix:main"
matrix_gui = "matr1x.scripts.matrix_gui:main"
matrix-gui = "matr1x.scripts.matrix_gui:main"

[project.gui-scripts]
sweep_generator = "matr1x.scripts.sweep_generator:main"
sweep-generator = "matr1x.scripts.sweep_generator:main"
matrix_script = "matr1x.scripts.matrix_script:main"
matrix-script = "matr1x.scripts.matrix_script:main"
matrix_preview = "matr1x.scripts.matrix_preview:main"
matrix-preview = "matr1x.scripts.matrix_preview:main"
control-dummy-legacy = "matr1x.control.control_dummy_legacy:main"
control-dummy = "matr1x.control.control_dummy:main"


[project.urls]
homepage = "https://github.com/andythomas/IFW_software"

[build-system]
# use flit since setuptools does currently not support PEP660
requires = ["flit_core >=3.6,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
addopts = "--capture=tee-sys --show-capture=all"
