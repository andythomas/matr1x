[project]
name = "matr1x-measurements"
version = "8.5.0"
description = "Python package for data acquisition and instrument control"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "tomli ; python_version < '3.11'",               # imported in matr1x
    "tomli-w",                                       # imported in matr1x
    "pydantic >= 2.0",                               # imported in matr1x
    "h5py >= 3.6.0",                                 # imported via util,
    "numpy >= 1.21.2",                               # imported via util
    "pyobjc >= 8.0 ; platform_system == 'Darwin'",   # imported via util
    "decorator >= 5.2.1",                            # imported via util
    "pandas >= 1.3.4",                               # imported via eval,
    "psutil >= 5.9.0",                               # imported via control/util
    "pyqtgraph >= 0.12.3",                           # needed for GUI apps
    "PySide6 >= 6.4.0",                              # needed for GUI apps
    "PySide6 >= 6.5.0 ; platform_system == 'Windows'", # needed for GUI apps
    "pygit2 >= 1.16",                                # needed for GUI apps
    "pygit2 >= 1.19; python_version >= '3.14'",      # needed for GUI apps Py 3.14+
    "wrapt > 2.0",                                   # needed for GUI apps
    "urwid > 2.0",                                   # needed for TUI matrix
    "script2bundle >= 0.3.0 ; platform_system == 'Darwin'", # needed for GUI apps for desktop integration
    "monaco-assets >= 0.5.1",                        # needed for matrix script
    "ruff == 0.15.22",                               # needed for matrix script
    "ty == 0.0.63",                                  # needed for matrix script
    "pymeasure >= 0.16.0",                           # shared by several device drivers
    "pyserial",                                      # shared by several device drivers
    "pyvisa >= 1.12.0",                              # shared by several device drivers
    "pyvisa-py >= 0.5.3",                            # shared by several device drivers
    "zeroconf >= 0.36.8",                            # needed by pyvisa-py resource discovery
    "minimalmodbus",                                 # shared by several device drivers
]

[project.optional-dependencies]
elab = ["elabapi_python >= 5.3.0", "jinja2"] # for the electronic notebook
ppms = [
    "MultiPyVu >= 3.6.1", # for matr1x/devices/quantumdesign/ppms,
]

[project.scripts]
matrix = "matr1x.scripts.matrix:main"
matrix-di = "matr1x.scripts.matrix_di:main"

[project.gui-scripts]
matrix-gui = "matr1x.scripts.matrix_gui:main"
sweep-generator = "matr1x.scripts.sweep_generator:main"
matrix-script = "matr1x.scripts.matrix_script:main"
matrix-preview = "matr1x.scripts.matrix_preview:main"
control-dummy = "matr1x.control.control_dummy:main"

[project.urls]
Homepage = "https://github.com/andythomas/matr1x"
Documentation = "https://andythomas.github.io/matr1x/"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "matr1x"
module-root = ""
source-exclude = [".gitignore"]

[tool.pytest.ini_options]
addopts = "--capture=tee-sys --show-capture=all"
timeout = 30
timeout_method = "thread"
session_timeout = 210
env = [
    "QT_QPA_PLATFORM=offscreen",
    "QT_QUICK_BACKEND=software",
]

[tool.ty.src]
include = [
    "matr1x",
    "tests"
]

[tool.ruff]
line-length = 99       # max per pep8

[tool.ruff.lint]
extend-select = [
    'D',        # pydocstyle (docstring formatting)
    'A',        # flake8 builtins (Python builtins being used as variables or parameters.)
    'I',        # isort (sort imports)
    'PLW0602',  # unassigned global variable
    'W505',     # doc line too long
    'E501',     # line too long
    'UP',       # use most modern code allowed by lowest python version
    'PTH',      # use modern pathlib methods if possible
    'LOG',      # look for correct logging
    'G',        # look for correct log formatting
    'INP001',   # provide __init__ for packages
    'PIE',      # use flake8-pie rules (unnecessary code pieces)
    'PYI',      # use flake8-pyi rules (type hinting helpers)
    'SIM300',   # use human readable comparisons (yoda condition)
    'RUF100',   # no not allow unused noqa
    'T201',     # do not use print statements
    'NPY',      # find numpy legace code
    'ISC',      # concatenate strings consistently
    'FIX',      # catch unfinished code parts
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # 'unsused import' has to be suppressed here
"tests/**" = ["INP001", "T201"] # tests do not need '__init__', print is fine

[tool.ruff.lint.pycodestyle]
max-line-length = 100
max-doc-length = 100  # should be max 72 per pep8

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
branch = "main"
build_command = "pip install uv && uv lock --offline && git add -- uv.lock && uv build --no-sources"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''^refactor''',
    '''^test''',
    '''^chore''',
    '''^ci''',
]

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.importlinter]
root_package = "matr1x"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "matr1x is free of import cycles"
type = "acyclic_siblings"
ancestors = [
    "matr1x",
]

[[tool.importlinter.contracts]]
name = "core must not import the matr1x root"
type = "forbidden"
source_modules = [
    "matr1x.core",
]
forbidden_modules = [
    "matr1x",
]

[[tool.importlinter.contracts]]
name = "layering: systems > control > gui > devices > core"
type = "layers"
layers = [
    "matr1x.systems",
    "matr1x.control",
    "matr1x.gui",
    "matr1x.devices",
    "matr1x.core",
]

[[tool.importlinter.contracts]]
name = "core and devices must not import Qt"
type = "forbidden"
source_modules = [
    "matr1x.core",
    "matr1x.devices",
]
forbidden_modules = [
    "PySide6",
    "pyqtgraph",
    "urwid",
    "monaco_assets",
]
ignore_imports = [
    # Lakeshore control GUI has external consumers; keep it in devices for now.
    "matr1x.devices.lakeshore.control -> PySide6",
]

[dependency-groups]
dev = [
    "import-linter",
    "pytest>=8.4.1",
    "pytest-env>=1.1.5",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "complexipy>=6.2.0",
]

docs = [
    "great-docs[svg]==0.16.0"
]

[tool.uv]
override-dependencies = [
    # grimp 3.16 has no cp314 macOS wheel (Rust build fails in CI-less envs); 3.15
    # has cp314 wheels for all platforms. (A marker-tagged override would drop
    # grimp from non-macOS installs entirely.)
    "grimp<3.16",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }

[tool.complexipy]
paths = ["matr1x"]
max-complexity-allowed = 15
snapshot-create = false
snapshot-ignore = false
