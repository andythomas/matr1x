# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

# Display Name
# Use the display_name field to specify how your package name appears in the site:
display_name: Matr1x

# Module Name (optional)
# ----------------------
# Set this if your importable module name differs from the project name.
# Example: project 'py-yaml12' with module name 'yaml12'
module: matr1x

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
parser: numpy

# Dynamic Introspection
# ---------------------
# Use runtime introspection for more accurate documentation (default: true)
# Set to false if your package has cyclic alias issues (e.g., PyO3/Rust bindings)
dynamic: true

# API Discovery Settings
# ----------------------
# Exclude items from auto-documentation
# exclude:
#   - InternalClass
#   - helper_function

skill:
  skills:
    - name: Installation
      file: skills/install/SKILL.md
    - name: Migration
      file: skills/migration/SKILL.md
    - name: Dependabot
      file: skills/dependabot/SKILL.md

# Logo & Favicon
# ---------------
# Point to a single logo file (replaces the text title in the navbar):
logo: media/matr1x-matrix-gui.svg
#favicon: media/matr1x-matrix-gui.svg
#
# For light/dark variants:
# logo:
#   light: assets/logo-light.svg
#   dark: assets/logo-dark.svg
#
# To show the text title alongside the logo, add: show_title: true

github_style: icon

# Funding / Copyright Holder
# --------------------------
# Credit the organization that funds or holds copyright for this package.
# Displays in sidebar and footer. Homepage and ROR provide links.
# funding:
#   name: "Posit Software, PBC"
#   roles:
#     - Copyright holder
#     - funder
#   homepage: https://posit.co
#   ror: https://ror.org/03wc8by49

# API Reference Structure
# -----------------------
# Customize the sections below to organize your API documentation.
# - Reorder items within a section to change their display order
# - Move items between sections or create new sections
# - Use 'members: false' to exclude methods from documentation
# - Add 'desc:' to sections for descriptions

announcement: "We are happy to announce the first publicly available version and welcome new users."

reference:
  # ── Top level: what `import matr1x` gives you ──────────────────────
  - title: Configuration
    desc: Global configuration object and accessors
    contents:
      - core.config:config # live global, rebound by reload_config
      - core.config:datetimefmt
      - core.config:reload_config
      - core.config:validation_errors
      - core.config:load_config
      - core.config:resolved_directory
      - core.config:system_directories
      - core.config:system_names
      - core.config:logfolder
      - core.config:usersfolder
      - core.config:output_extension
      # Config schema: every configuration item is a field of these models
      - core.config_schema:MainConfig
      - core.config_schema:Matr1xConfig
      - core.config_schema:Matr1xInstallConfig
      - core.config_schema:Matr1xDevicesConfig
      - core.config_schema:Matr1xDevicesVisadeviceConfig
      - core.config_schema:Matr1xScriptsConfig
      - core.config_schema:Matr1xScriptsMatrix_ScriptConfig
      - core.config_schema:Matr1xScriptsMatrix_ScriptShortcutsConfig
      - core.config_schema:Matr1xEmailConfig
      - core.config_schema:UserlibConfig
      - core.config_schema:UserlibInstallConfig

  # ── System framework ────────────────────────────────────────────────
  - title: System
    desc: Base classes for measurement systems
    contents:
      - name: core.system.base:System
        members: false
      - core.system.base:System.add_param
      - core.system.base:System.add_dev
      - core.system.base:System.set
      - core.system.base:System.reset
      - core.system.base:System.name # property
      - core.system.base:System.hdf5 # property

  # ── Control GUI framework ───────────────────────────────────────────
  - title: Control
    desc: Framework for device control panels
    contents:
      - name: control.controlwindow:ControlWindow
        members: false
      - name: control.gui_dict:GuiDict
        members: false
      - control.gui_dict:MethodBundle
      - control.gui_dict:catchEmitError
      - control.gui_dict:guiObject
      - control.gui_dict:var
      - control.util:control_main
      - control.util:linear_trend
      - control.util:sendNotificationEmail
      - control.util:MyQDockWidget

  # ── Data models ─────────────────────────────────────────────────────
  - title: Models
    desc: Pydantic models exchanged between systems and scripts
    contents:
      - core.models:Message
      - core.models:Modifier
      - core.models:format_validation_error

  # ── Data analysis ───────────────────────────────────────────────────
  - title: Eval
    desc: Loading and analyzing measurement data
    contents:
      - core.eval:loadmatrix
      - core.eval:delta
      - core.eval:delta3p

  # ── Utility functions ───────────────────────────────────────────────
  - title: Util
    desc: Shared helper classes and functions
    contents:
      - name: core.util:Command
        members: false
      - core.util:Get
      - core.util:Set
      - core.util:get_package_path

  # ── SCPI server ─────────────────────────────────────────────────────
  - title: SCPI Server
    contents:
      - core.scpi_tcpserver:DEFAULT_PORT
      - core.scpi_tcpserver:SCPI_TCP_Server

  # ── GUI building blocks ─────────────────────────────────────────────
